# aXet template — CI test takimlari (K2, 2026-09-15).
#
# KAPSAM BEYANI — bu is akisi NEYE BAKMAZ:
#   * Canli SAP: hicbir is .conn_adt okumaz, SAP'ye baglanmaz (takimlar zaten cevrimdisi).
#   * Linux/macOS: yalnizca windows-latest kosar. Gerekce: tests/test_kur.py Windows disinda
#     kendini atlar (test_kur.py:66) ve tests/test_yeni_proje.py'de atlama korumasi YOK ->
#     Linux runner'i yesil gorunurken gercekte kapsam kaybettirirdi.
#   * Kurulum sonrasi davranis: install.py + doctor.py ayri iste kosar, ama global config'i
#     olmayan TEMIZ bir runner'da olculur; gercek kullanici makinesindeki birikmis config
#     durumunu TEMSIL ETMEZ.
#   * Skill govde/dokuman kalitesi: burada olculmez (bug gate + doc checklist isi).
#   * GERCEK aXet (axet-code) entegrasyonu: CI'da SAHTE (0 baytlik) bir axet-code.exe kurulur.
#     kur.ps1'in Axet-Bul'u yalnizca VARLIK arar, binary'yi CALISTIRMAZ -> on kosul kontrolu
#     olculur, aracin kendisi OLCULMEZ. Gercek aXet sirket kanalindan kurulur, CI'a kurulamaz.
#     Stub bilerek PATH'e KONMAZ, yalniz %LOCALAPPDATA%\axet-code\bin altina konur: boylece
#     install.py/doctor.py'nin `shutil.which("axet-code")` sonucu bugunku gibi BULUNAMADI kalir
#     ve o iki betigin olculen davranisi degismez.
name: testler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  takimlar:
    name: Testler (${{ matrix.takim }} · Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # TAKIM BOYUTU (2026-09-16, kullanici karari) — kok ve foundation takimlari
        # AYNI job'da SIRAYLA kosuyordu; olculdu (kosum #14): kok 275/293 sn +
        # foundation 375/393 sn = 668 sn seri, job toplami 674/710 sn. Geri kalan HER SEY
        # (checkout + setup-python + pip + on kosullar + sap-code-review) toplam 25 sn,
        # yani surenin %99'u bu iki takim.
        # Ayri kollara alinca duvar saati max(296, 393) ~ 6.6 dk'ya duser (11.8 dk'dan).
        # KAPSAM DEGISMEZ: ayni komutlar, ayni on kosullar, ayni matris.
        # Maliyet: toplam derleme suresi 1348 -> ~1430 sn (+%6, on kosullar iki kez kosuyor).
        # NOT (2026-09-16): hesabin Actions kotasi OLCULEMEDI (billing ucu 404 - token
        # kapsami yok). ⛔ 2026-09-20: O OLCULEMEYEN RISK GERCEKLESTI — kota doldu ve isler
        # SIFIR adimla "failure" donmeye basladi (check-run annotation: "The job was not
        # started because recent account payments have failed or your spending limit needs
        # to be increased"). Tani is loglarinda DEGIL, annotation'dadir; `gh run rerun`
        # cozmez. Matris bu yuzden daraltildi (asagi).
        # kok-public (2026-09-21, Z27): kok takimi PUBLIC DUZENINDE — yayin_hazirla'nin
        # DISLANANLAR'i (maintenance/, _lab/ ...) silinmis agacta. NEDEN: tuketici testleri
        # public agacta kosar, CI ise dev agacini olcuyordu; olculdu: gercek public v0.4.0'da
        # 2 test sinifi 9 failure + 8 error veriyordu, CI yesildi. ci-durum `hepsi_yesil` bu
        # kola da baglidir (CI_ASGARI_TAKIMLAR). Paralel kostugu icin bekleme suresi uzamaz.
        takim: [kok, foundation, kok-public]
        # TARIHCE — cift surum kolu NEDEN vardi: "su surumden itibaren destekleniyor"
        # iddiasi VARSAYILMASIN, OLCULSUN diye. Ise de yaradi (asagidaki 3.9/3.10 vakalari).
        # BUGUN TEK KOL: gerekce kota, kapsamin gereksizligi DEGIL.
        #
        # TABAN 3.9 -> 3.10 -> 3.12 · UST KOL 3.13 -> 3.14 (2026-09-16, kullanici karari).
        #
        # NEDEN 3.10'DA KALINMADI: destek takvimi olculdu — 3.10 EOL 31 Ekim 2026, yani
        # taban ilan edildiginden ~6 hafta sonra oluyordu; ayrica 3.13'un bugfix evresi
        # 1 Ekim 2026'da bitiyor (o tarihten sonra "guncel kol" guncel olmazdi). 3.12
        # Ekim 2028'e, 3.14 Ekim 2030'a kadar destekli.
        # 3.10 KOSTU VE DUSTU (kosum #11: 3.10 -> 2 failure, 3.13 -> yesil): asagidaki
        # 2. kusur 3.10'da HALA acikti. Yani "3.10 gecer" varsayimi olsaydi yanlis olurdu.
        # 3.12 SECIMI OLCULDU, varsayilmadi: yerelde Python 3.12.10 ile
        # test_f1_belirsiz_origin... GECTI ve urllib 'https://[SECRETTOKEN]/r' icin
        # ValueError veriyor (katilik 3.12'de VAR).
        # ⚠ UST KOLUN OLCTUGU GERCEK BIR KUSUR VARDI, kayit icin: `siniflandir.py` icindeki
        # `test_yanlis_harfli_glob_deseni_yakalanir` YALNIZ 3.14'te kirilmisti (3.13+ ile
        # `Path.glob` joker icermeyen parcalari DESENDEKI harfle donduruyor). Yani ust kol
        # "fazlalik" degildi; bugun o SINIF kusur artik CI'da OLCULMUYOR. Kota cozulunce
        # ust kolu geri koymanin en ucuz bicimi: yalniz `main` push'unda ya da haftalik
        # `schedule` ile kosturmak (PR maliyeti artmaz, iddia olculmus kalir).
        #
        # Ilk daraltmanin gerekcesi: matris isini yapti ve
        # "3.9 destekleniyor" iddiasinin YANLIS oldugunu olctu (kosum #10, 3.9 kolu 4 failure;
        # 3.13 ve kurulum yesil). Iki ayri kusur:
        #   1) 4 validator dosyasinda PEP 604 (`X | None`) var, `from __future__ import
        #      annotations` korumasi yok -> 3.9'da reviewer HIC yuklenemiyor
        #      ("TypeError: unsupported operand type(s) for |"). AST taramasi: 6 yer / 4 dosya.
        #   2) yeni_proje.depo_onerisi, guvenle ayristirilamayan bir origin'i reddetmeyi
        #      urllib'in SURUM KATILIGINA birakmis; 3.9'da fail-open (bozuk adres "yerel"
        #      yerine ONERI olarak donuyor). Guvenlige dokunan karar surume devredilmis.
        # Karar iddiayi DUZELTMEK degil DARALTMAK: 3.9 bugun de fiilen desteklenmiyordu,
        # degisen tek sey durustluk.
        # ✅ KAPANDI (2026-09-16): README/kur.ps1'deki "3.9" metinleri guncellendi ve
        # kur.ps1'e TEK DOGRULUK KAYNAGI konuldu ($script:PyAsgari). Buradaki taban ile
        # kur.ps1'in kapisi artik ayni seyi soyluyor; ikisi ayrilirsa test_kur.py:872,936
        # kirmiziya doner (mutasyonla dogrulandi).
        # ⛔ 3.14 KOLU KALDIRILDI (2026-09-20, kullanici karari) — gerekce KOTA, kapsam degil.
        # Olculdu: hesabin Actions kotasi doldu ve isler SIFIR adimla dusmeye basladi
        # (check-run annotation: "The job was not started because recent account payments
        # have failed or your spending limit needs to be increased"). Maliyet aritmetigi:
        # PRIVATE repo + windows-latest (2x carpan) + kok takimi 2411 sn x 2 surum
        # => kosum basina ~190 faturalanabilir dakika; 2000 dk'lik kota ~10 kosumda biter.
        # 3.14 kolunu atmak kosum basina ~%45 dusuruyor.
        # ⚠ KAPSAM KAYBI ACIKCA: "3.14'te de calisiyor" artik OLCULMUYOR, VARSAYILIYOR.
        # 3.14'e ozgu bir kirilma CI'da degil, kullanicinin makinesinde ortaya cikar.
        # Ucuz telafi (bugun YAPILMADI, acik kalem): 3.14 kolunu yalniz main push'unda ya da
        # haftalik schedule'da kosturmak — PR maliyeti dusmeye devam eder, iddia olculmus kalir.
        # ⛔ 3.14 KOLU GERI GELMEDI (2026-09-21, kullanici karari, Z19) — depo public oldugu
        # icin kota gerekcesi kalkti, ama yeni gerekce KULLANICI HIZI: 3.14 kolu kirilirsa
        # ci-durum `hepsi_yesil` diyemez ve o yayinda HERKES yavas tam olcume duser.
        # Hedef (Z25): CI surumu = kullanici surumu — tek sabit surum, kurucu/guncelleme
        # kullaniciyi o surume ceker, ikinci kol anlamsizlasir.
        python: ['3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Surumleri bas
        run: |
          python --version
          git --version

      # ON KOSUL 0 — depo bir DALIN uzerinde olmali. actions/checkout depoyu detached ve
      # YEREL DALSIZ birakir; tests/test_kur.py setUpClass kendi fixture'ini `git clone --bare
      # <bu depo>` ile kurdugu icin dalsizlik bare kopyaya, oradan da calisma klonuna geciyor
      # ve `git push -q origin HEAD` "The destination you provided is not a full refname" ile
      # dusuyor. Olculdu (2026-09-16, 3 kollu): dalda -> gecti · detached ama DALLAR VAR ->
      # gecti · detached + dalsiz -> CI'daki hatanin AYNISI. Yani belirleyici olan detached
      # olmak degil, yerel dalin BULUNMAMASI. Tam takim: dalsiz 252/15 -> bu adimla 252/0.
      # NOT (acik kalem): asil kirilganlik testlerde — fixture calisilan deponun ortam
      # durumunu devraliyor. Kalici cozum `uzakta_commit`in HEAD yerine tam refname itmesi
      # ya da bare sablonun dalini garanti etmesidir; bu adim CI'yi normal bir calisma
      # klonuna benzetir, o baglantiyi KALDIRMAZ.
      # Dal adi bilerek `main`: olculen kol buydu ve normal bir calisma klonunun hali budur.
      # PR'da bu yerel `main`, merge commit'ine isaret eder (origin/main'e DEGIL) — fixture
      # kendi icinde tutarli oldugu icin testler icin dogru olan da budur.
      - name: On kosul - dal uzerinde ol
        run: git checkout -B main

      # ON KOSUL 1 — sahte axet-code. Olculdu (2026-09-16, yerelde CI kosulu taklit edilerek,
      # 3 kollu): gercek axet-code VAR -> test_kur 36/1 · YOK -> 36/30 · sahte stub ile -> 36/1.
      # Yani kosum #1'deki 36 failure'in 30'u tek bir on kosul bosluguydu, kod kusuru DEGILDI
      # (kur.ps1:371-375 -> `Bitir 2`). Testler ayni sahte-dosya yontemini zaten kullaniyor
      # (tests/test_kur.py dar_ortam: axet-code.exe write_bytes(b"")).
      - name: On kosul - sahte axet-code
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'axet-code\bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $bin 'axet-code.exe') | Out-Null
          Write-Host "sahte axet-code: $bin (PATH'e EKLENMEDI - bkz. kapsam beyani)"

      # ON KOSUL 2 — SAP ADT foundation takiminin calisma zamani bagimliliklari. Olculdu:
      # kurulmazsa o takim 6 test / 6 error verir (ModuleNotFoundError: dotenv) ve kok takimdaki
      # test_run_tests_cli.py:47 de bu yuzden duser. Dosya repoda ZATEN vardi, CI onu hic kurmuyordu.
      - name: On kosul - Python bagimliliklari
        run: python -m pip install --quiet -r skills-sap/sap-adt-foundation/scripts/requirements.txt

      # Asagidaki uc adim `takim` matris boyutuna gore ayrisir. sap-code-review yalnizca
      # 3 sn surdugu icin kok koluna binmistir — kendi kolunu acmak on kosul maliyetini
      # (13 sn) kazancindan buyuk yapardi.
      # PUBLIC DUZEN — dislanacak yollar yayin_hazirla.DISLANANLAR'dan OKUNUR (sabit yazilmaz,
      # bayatlamasin). Silme COMMIT'lenir: test_kur fixture'i bu depoyu HEAD'den klonluyor.
      # `python -B`: import __pycache__ birakip maintenance/ klasorunu diriltmesin.
      # URETILEN DOSYALAR (Z33, 2026-09-21): kullanici agacinda yayin aracinin URETTIGI dosyalar
      # (CHANGELOG.md, guncelle/yayinlar.json, guncelle/ci-durum.json) da vardir; bu kol onlari
      # uretmiyordu ⇒ yalniz yayinlanan agacta kirmizi olan bir test (ci-durum.json'un diskte
      # OLMADIGINI varsayan) public CI'da 3 yayin boyunca kirmiziydi, burada gorunmedi. Artik ayni
      # arac (`--yalniz-tara --ci-durum-yok`) calistirilip uretilenler agaca konur.
      # BILINCLI YAN ETKI: `--yalniz-tara` yayin sizinti taramasini da kosar; BLOCKER (rc=1)
      # bulursa bu kol KIRMIZI olur — yayinda zaten duracak bir sizinti PR'da gorunur.
      # Public depoda bu adim ATLANIR (maintenance/ yok, agac ZATEN public) — orada `kok` kolu
      # yayinlanan agacin kendisini olcer.
      # MUSTERI/KURUM AD LISTESI (Z134): adlar koda yazilmaz; tarama onlari gizli degiskenden okur.
      # Gizli degisken yoksa (fork PR'i, tanimsiz) KAPSAM satiri "YUKLENMEDI ... OLCULEMEDI" der ve
      # kol yine yesil olabilir — o durumda asil kapi bakimcinin yerel yayin taramasidir.
      # Adim YALNIZ bu degiskeni gorur; test adimlari gormez (testler kendi listesini kurar).
      - name: Public duzen - dislananlari sil + uretilenleri koy
        if: matrix.takim == 'kok-public' && hashFiles('maintenance/yayin_hazirla.py') != ''
        env:
          AXET_SIZINTI_EK: ${{ secrets.AXET_SIZINTI_EK }}
        run: |
          $py = "import sys; sys.path.insert(0, 'maintenance'); import yayin_hazirla as y; print(' '.join"
          $d = python -B -c "$py(y.DISLANANLAR))"
          $u = python -B -c "$py(y.URETILEN_DOSYALAR))"
          $hedef = Join-Path $env:RUNNER_TEMP 'yayin-agaci'
          python -B maintenance/yayin_hazirla.py --hedef $hedef --yalniz-tara --ci-durum-yok
          if ($LASTEXITCODE -ne 0) { throw "yayin_hazirla --yalniz-tara basarisiz (rc=$LASTEXITCODE)" }
          foreach ($f in $u.Split(' ')) {
            $ust = Split-Path $f
            if ($ust) { New-Item -ItemType Directory -Force -Path $ust | Out-Null }
            Copy-Item -Force (Join-Path $hedef $f) $f
          }
          Write-Host "dislanan: $d"
          Write-Host "uretilen: $u"
          git rm -r -q --ignore-unmatch $d.Split(' ')
          git add -A -- $u.Split(' ')
          if ($LASTEXITCODE -ne 0) { throw "uretilen dosyalar stage edilemedi (rc=$LASTEXITCODE)" }
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m public-duzen
          if ($LASTEXITCODE -ne 0) { throw "public-duzen commit'i basarisiz (rc=$LASTEXITCODE)" }
          if (Test-Path maintenance) { throw "maintenance/ hala var - public duzen kurulamadi" }
          # Diskte olmasi yetmez: test_kur fixture'i HEAD'den klonlar ⇒ dosya IZLENIYOR olmali (commit sonrasi index = HEAD).
          foreach ($f in $u.Split(' ')) {
            git ls-files --error-unmatch -- $f | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "uretilen dosya commit'te yok: $f" }
          }

      - name: Kok takim
        if: matrix.takim == 'kok' || matrix.takim == 'kok-public'
        run: python tests/run_tests.py

      - name: sap-code-review takimi
        if: matrix.takim == 'kok'
        run: python -m unittest discover -s skills-sap/sap-code-review/tests -v

      # Z49 (2026-09-21): belge skill'lerinin takimlari CI'da HIC kosmuyordu (yalniz tuketici
      # guncellemesinde, harita.json uzerinden). Tarayici testleri varsayilan kapali, indirme yok.
      - name: Belge skill takimlari (sap-fs-ts-docs + sap-ui5-user-guide)
        if: matrix.takim == 'kok'
        run: |
          python skills-sap/sap-fs-ts-docs/tests/run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python skills-sap/sap-ui5-user-guide/tests/run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SAP ADT foundation takimi
        if: matrix.takim == 'foundation'
        run: python skills-sap/sap-adt-foundation/tests/run_tests.py

      # Z119 (2026-09-26, kullanici karari): sap-ui5-fiori takimi CI'da HIC kosmuyordu (yalniz yerelde).
      # Stdlib-only: SAP/internet/npm yok, ag yalniz 127.0.0.1 sahte sunucusu; smoke testi playwright
      # KURULU DEGILSE (skill klasorunde node_modules yok) kurulum mesajini bekler, indirme yapmaz.
      # Olculdu (2026-09-26, yerel, BelowNormal oncelik, tek kosum): 100 test, 0 failure, ~84 sn.
      # NEDEN foundation kolu: kok kolu uzun kol (kok takimi 2411 sn, yukaridaki not); foundation
      # kolu (~393 sn) kisa oldugu icin eklenen sure matrisin duvar saatini uzatmaz. Ek bagimlilik yok.
      - name: SAP UI5 fiori takimi
        if: matrix.takim == 'foundation'
        run: python skills-sap/sap-ui5-fiori/tests/run_tests.py

  kurulum:
    name: Kurulum dumani (install + doctor)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install.py --dry-run
        run: python scripts/install.py --dry-run

      - name: install.py
        run: python scripts/install.py

      - name: doctor.py
        run: python scripts/doctor.py

  # YAYIN PROVASI (Z28, 2026-09-21) — aday yayini GERCEK public gecmisin ustune (yalniz runner'daki
  # gecici klona, push KAPALI) kurar; son yayindan ve v0.1.0'dan temiz tuketici klonlarinda gercek
  # `%guncelle` motorunu adim 2-14 kosar, ardindan eski surumle acilmis projede `guncelle_proje`.
  # NEDEN: birim testleri kurallari yapay girdiyle dener; kullanicinin akisini hicbiri kosmuyordu.
  # Olculdu: v0.4.0 (public agacta 20 kirmizi) ve v0.4.1 (kapanista sahte "cakisma isareti",
  # `%guncelle-proje` "klon geride") kusurlarini kullanici buldu — ucu de bu akistaydi.
  # Katalogda yayinlanmamis etiket yoksa "ATLANDI" der ve yesil doner (hukum YOK).
  # Paralel kostugu icin bekleme suresini uzatmaz. Kapsam beyani aracin ciktisindadir.
  # YALNIZ gelistirme deposunda: public agacta maintenance/ yoktur (DISLANANLAR) ve bu dosya
  # public'e de gider — kosulsuz olsaydi her yayin push'unda "can't open file" ile kirmizi
  # yanardi (bug gate 2026-09-21).
  prova:
    name: Yayin provasi (guncelle uctan uca)
    if: github.repository == 'ozgurylmz34/axet'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: On kosul - Python bagimliliklari
        run: python -m pip install --quiet -r skills-sap/sap-adt-foundation/scripts/requirements.txt

      # Prova gercek yayin_hazirla'yi kosar; Z134 kapisi ad listesi yoksa gercek yayini baslatmaz
      # => bu adim da ayni gizli degiskeni gorur (yalniz bu adim; fork PR'inda gizli deger yoktur).
      - name: Yayin provasi
        env:
          AXET_SIZINTI_EK: ${{ secrets.AXET_SIZINTI_EK }}
        run: python maintenance/yayin_provasi.py
