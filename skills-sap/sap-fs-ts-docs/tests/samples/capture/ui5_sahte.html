<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sahte UI5 sayfası (capture_kd_screens doğrulama adımları testi)</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #ust { height: 120px; }
  #asagi { position: absolute; top: 3000px; left: 0; width: 200px; height: 50px; }
  #yarim { position: absolute; top: 0; left: -100px; width: 200px; height: 50px; }
  #gizli { display: none; }
  #sapUiBusyIndicator { visibility: hidden; }
</style>
</head>
<body>
<!-- UI5 çalışma zamanının yalnız capture_kd_screens.js busyProbe'unun okuduğu yüzeyi taklit eder:
     sap.ui.core.Element.registry.filter · sap.ui.require("sap/ui/core/BusyIndicator") · getBusy/getDomRef/getId ·
     #sapUiBusyIndicator · .sapUiLocalBusyIndicator blok katmanı. Senaryo ?durum=<ad> ile seçilir. -->
<div id="ust"><h1 id="baslik">Siparişler</h1><footer id="alt">Kaydet · İptal</footer></div>
<div id="tablo" class="">Tablo</div>
<div id="asagi">Aşağıda</div>
<div id="yarim">Yarım</div>
<div id="gizli">Gizli metin</div>
<div id="sapUiBusyIndicator"></div>
<script>
(function () {
  var durum = new URLSearchParams(location.search).get("durum") || "bos";
  if (durum === "ui5yok") return;
  function kontrol(id, mesgul) {
    return { getId: function () { return id; }, getBusy: function () { return mesgul(); },
             getDomRef: function () { return document.getElementById(id); } };
  }
  var tabloMesgul = durum === "yerel" || durum === "yerel-kapanir";
  var kontroller = [kontrol("baslik", function () { return false; }),
                    kontrol("tablo", function () { return tabloMesgul; }),
                    kontrol("gizli", function () { return durum === "gizli-mesgul"; })];
  var popupAcik = durum === "global";
  var BI = { bOpenRequested: durum === "global-bekliyor", oPopup: { isOpen: function () { return popupAcik; } } };
  window.sap = { ui: { core: { Element: { registry: { filter: function (f) { return kontroller.filter(f); } } } },
                       require: function (ad) { return ad === "sap/ui/core/BusyIndicator" ? BI : undefined; } } };
  if (durum === "yerel" || durum === "yerel-kapanir") {
    var k = document.createElement("div");
    k.className = "sapUiLocalBusyIndicator";
    k.textContent = "…";
    document.getElementById("tablo").appendChild(k);
    document.getElementById("tablo").className = "sapUiLocalBusy";
  }
  if (durum === "artik-sinif") {
    // UI5 unblock blok katmanını siler, ebeveyndeki sapUiLocalBusy sınıfını silmez → meşgul SAYILMAMALI
    document.getElementById("tablo").className = "sapUiLocalBusy";
  }
  if (durum === "global-dom") {
    document.getElementById("sapUiBusyIndicator").style.visibility = "visible";
    document.getElementById("sapUiBusyIndicator").style.height = "10px";
  }
  // Freestyle sap.m: BusyDialog (iç Dialog 'sapMBusyDialog' sınıfı + isOpen) ve sap.m.BusyIndicator (.sapMBusyIndicator)
  if (durum === "busydialog" || durum === "busydialog-dom") {
    var d = document.createElement("div");
    d.id = "bd-Dialog";
    d.className = "sapMDialog sapMBusyDialog";
    d.innerHTML = '<div class="sapMBusyIndicator" id="bd-busyInd">…</div>';
    document.body.appendChild(d);
    if (durum === "busydialog") {
      kontroller.push({ getId: function () { return "bd-Dialog"; }, getBusy: function () { return false; },
        getDomRef: function () { return d; }, isA: function (t) { return t === "sap.m.Dialog"; },
        hasStyleClass: function (c) { return c === "sapMBusyDialog"; }, isOpen: function () { return true; } });
    }
  }
  if (durum === "m-busy" || durum === "m-busy-gizli") {
    var m = document.createElement("div");
    m.id = "yukleniyor";
    m.className = "sapMBusyIndicator";
    m.textContent = "…";
    if (durum === "m-busy-gizli") m.style.display = "none";
    document.getElementById("ust").appendChild(m);
  }
  // capture_kd_screens scroll_reset: kaydırılmış kapsayıcılar. #grid-hsb / #grid-icerik UI5 ızgara tablosunun
  // yatay kaydırma desenini taklit eder: içerik overflow:hidden, ayrı kaydırma çubuğunun 'scroll' olayı içeriği eşitler.
  if (durum === "kaydirma" || durum === "kaydirma-inat") {
    var kutu = function (id, ovf) {
      var d = document.createElement("div");
      d.id = id;
      d.style.cssText = "width:200px;height:60px;overflow:" + ovf + ";";
      d.innerHTML = '<div style="width:2000px;height:400px;">' + id + '</div>';
      document.body.appendChild(d);
      return d;
    };
    var genis = kutu("genis", "auto");
    var hsb = kutu("grid-hsb", "scroll");
    var icerik = kutu("grid-icerik", "hidden");
    hsb.addEventListener("scroll", function () { icerik.scrollLeft = hsb.scrollLeft; });
    genis.scrollLeft = 500; genis.scrollTop = 100;
    hsb.scrollLeft = 700; icerik.scrollLeft = 700;
    window.scrollTo(0, 300);
    if (durum === "kaydirma-inat") {
      genis.addEventListener("scroll", function () { if (genis.scrollLeft !== 400) genis.scrollLeft = 400; });
    }
    var rapor = document.createElement("div");
    rapor.id = "kaydirma-durum";
    document.getElementById("ust").appendChild(rapor);
    setInterval(function () {
      rapor.textContent = "genis=" + genis.scrollLeft + "," + genis.scrollTop + " hsb=" + hsb.scrollLeft +
        " icerik=" + icerik.scrollLeft + " sayfa=" + Math.round(window.scrollY);
    }, 50);
  }
  // capture_kd_screens fill / press: girilen değer ve basılan tuş görünür metne yansır.
  if (durum === "etkilesim") {
    var alan = document.createElement("div");
    alan.innerHTML = '<input id="musteri-inner"><input id="ikinci"><div id="yansima"></div><div id="tus"></div>';
    document.getElementById("ust").appendChild(alan);
    ["musteri-inner", "ikinci"].forEach(function (id) {
      var g = document.getElementById(id);
      g.addEventListener("input", function () { document.getElementById("yansima").textContent = "deger:" + g.value; });
      g.addEventListener("keydown", function (e) {
        document.getElementById("tus").textContent = "tus:" + e.key + "@" + e.target.id;
      });
    });
  }
  if (durum === "yerel-kapanir") {
    setTimeout(function () {
      tabloMesgul = false;
      var b = document.querySelector("#tablo .sapUiLocalBusyIndicator");
      if (b) b.remove();
    }, 800);
  }
})();
</script>
</body>
</html>
